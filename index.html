<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- Garante a responsividade e o dimensionamento correto em diferentes telas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellow MTG Proxy</title>
    <!-- Vincula as regras de estilização externas -->
    <link rel="stylesheet" href="styles.css">
    <!-- Importação da biblioteca mana-font para renderizar os símbolos -->
    <link href="//cdn.jsdelivr.net/npm/mana-font@latest/css/mana.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <!-- === ESTRUTURA PRINCIPAL === -->
    <!-- Contêiner principal estrutural usando Flexbox para dividir menu e área de trabalho -->
    <div class="layout-container">

        <!-- === MENU LATERAL === -->
        <!-- Barra lateral de navegação e controles -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Menu</h2>
            </div>

            <!-- Contêiner do sistema de busca -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Ex: Sol Ring">
                <button id="searchButton">Pesquisar</button>
            </div>
        </aside>

        <!-- === ÁREA PRINCIPAL === -->
        <!-- Área de exibição dinâmica -->
        <main class="main-content">

            <!-- Contêiner destinado à renderização das cartas -->
            <div id="cardsContainer">

                <!-- Molde da carta -->
                <div class="mtg-card">
                    <!-- Fundo branco da carta -->
                    <div class="card-inner">
                        <!-- Cabeçalho contendo nome e custo de mana -->
                        <div class="card-header">
                            <span class="card-name">Nome</span>
                            <span class="card-mana">Custo</span>
                        </div>

                        <!-- Espaço reservado para a futura inserção gráfica da arte -->
                        <div class="card-art-placeholder">[Arte]</div>

                        <!-- Linha descritiva de tipos e subtipos -->
                        <div class="card-type">Tipo</div>

                        <!-- Caixa do texto de regras da carta -->
                        <div class="card-text-box">Texto</div>

                        <!-- Rodapé para status de combate (poder/resistência) -->
                        <div class="card-footer">
                            <span class="card-pt">Poder/Resistência</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- === TABELA DE DEPURAÇÃO === -->
            <!-- Ferramenta de depuração para inspeção visual do JSON da API -->
            <div id="debugTableContainer">
                <h3>Dados do Scryfall</h3>
                <table id="debugTable">
                    <thead>
                        <tr>
                            <th>Propriedade</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <!-- Corpo da tabela onde o script injetará os dados -->
                    <tbody id="debugTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Script posicionado no final para garantir o pré-carregamento do DOM -->
    <script src="script.js"></script>
</body>

</html>
